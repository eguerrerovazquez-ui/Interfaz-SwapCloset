<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/buscar"></ion-back-button>
    </ion-buttons>
    <!-- Muestra el nombre en la barra superior si existe -->
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  @if (datos) {
    <div class="perfil-detalle">
      <img [src]="datos.userPfp" class="img-perfil">
      <h1>{{ datos.userName }}</h1>
    </div>
  } @else {
    <p>No se encontraron datos para este usuario.</p>
  }

  @if (datos_perfil){
    <div class="info">
      <p>Talla: {{datos_perfil.userTalla}}</p>
      <p>Valoracion: {{datos_perfil.userValoracion}} ⭐</p>
    </div>
  }

  <div class="grid-favoritos">
    @for (publi of publis; track publi.userName) {
      <app-publicaciones [publicaciones]="publi"></app-publicaciones>
    }
  </div>
</ion-content>
